name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Verify Backend Imports
      run: |
        cd backend
        python -c "from app.main import app; print('Imports successful')"

  web-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: "18"
    - name: Install dependencies
      run: |
        cd web
        npm ci
    - name: Build Web App
      run: |
        cd web
        npm run build

  mobile-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: "18"
    - name: Install dependencies
      run: |
        cd mobile
        npm install
    - name: TypeScript Compile Check
      run: |
        cd mobile
        npx tsc --noEmit
